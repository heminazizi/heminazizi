<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#18406A"/>
    </linearGradient>
    <clipPath id="frame2">
      <rect x="0" y="0" width="1280" height="320"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame2)">
    <rect width="1280" height="320" fill="url(#bg2)"/>

    <!-- blueprint grid -->
    <g stroke="#3A6491" stroke-opacity="0.28" stroke-width="1">
      <line x1="0" y1="40" x2="1280" y2="40"/>
      <line x1="0" y1="80" x2="1280" y2="80"/>
      <line x1="0" y1="120" x2="1280" y2="120"/>
      <line x1="0" y1="160" x2="1280" y2="160"/>
      <line x1="0" y1="200" x2="1280" y2="200"/>
      <line x1="0" y1="240" x2="1280" y2="240"/>
      <line x1="0" y1="280" x2="1280" y2="280"/>
      <line x1="80" y1="0" x2="80" y2="320"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="320" y1="0" x2="320" y2="320"/>
      <line x1="440" y1="0" x2="440" y2="320"/>
      <line x1="560" y1="0" x2="560" y2="320"/>
      <line x1="680" y1="0" x2="680" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="920" y1="0" x2="920" y2="320"/>
      <line x1="1040" y1="0" x2="1040" y2="320"/>
      <line x1="1160" y1="0" x2="1160" y2="320"/>
    </g>

    <!-- frame coordinate ticks -->
    <g stroke="#CFE3F2" stroke-opacity="0.5" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="1280" y1="0" x2="1280" y2="10"/>
      <line x1="0" y1="320" x2="0" y2="310"/>
      <line x1="1280" y1="320" x2="1280" y2="310"/>
    </g>

    <!-- triangulation network, right two-thirds -->
    <g stroke="#8FB4D9" stroke-opacity="0.55" stroke-width="1.3" fill="none">
      <line x1="700" y1="70" x2="770" y2="150"/>
      <line x1="700" y1="70" x2="880" y2="90"/>
      <line x1="770" y1="150" x2="880" y2="90"/>
      <line x1="770" y1="150" x2="860" y2="245"/>
      <line x1="880" y1="90" x2="860" y2="245"/>
      <line x1="880" y1="90" x2="965" y2="180"/>
      <line x1="860" y1="245" x2="965" y2="180"/>
      <line x1="860" y1="245" x2="770" y2="285"/>
      <line x1="965" y1="180" x2="1040" y2="235"/>
      <line x1="965" y1="180" x2="1055" y2="115"/>
      <line x1="1040" y1="235" x2="1055" y2="115"/>
      <line x1="1040" y1="235" x2="1150" y2="200"/>
      <line x1="1055" y1="115" x2="1150" y2="200"/>
      <line x1="1055" y1="115" x2="1125" y2="55"/>
      <line x1="1150" y1="200" x2="1210" y2="270"/>
      <line x1="1150" y1="200" x2="1125" y2="55"/>
      <line x1="965" y1="180" x2="945" y2="45"/>
      <line x1="1055" y1="115" x2="945" y2="45"/>
    </g>

    <!-- traverse points (circles) -->
    <g fill="#CFE3F2">
      <circle cx="700" cy="70" r="3.2"/>
      <circle cx="770" cy="150" r="3.2"/>
      <circle cx="860" cy="245" r="3.2"/>
      <circle cx="770" cy="285" r="3.2"/>
      <circle cx="1040" cy="235" r="3.2"/>
      <circle cx="1150" cy="200" r="3.2"/>
      <circle cx="1210" cy="270" r="3.2"/>
      <circle cx="1125" cy="55" r="3.2"/>
      <circle cx="945" cy="45" r="3.2"/>
    </g>

    <!-- triangulation stations (open triangles) -->
    <g fill="none" stroke="#CFE3F2" stroke-width="1.3" stroke-linejoin="round">
      <path d="M 880 84 L 886 94 L 874 94 Z"/>
      <path d="M 965 174 L 971 184 L 959 184 Z"/>
      <path d="M 1055 109 L 1061 119 L 1049 119 Z"/>
    </g>

    <!-- primary benchmark, single accent highlight -->
    <g>
      <circle cx="965" cy="180" r="7" fill="none" stroke="#C9A227" stroke-width="1.6"/>
      <circle cx="965" cy="180" r="2.2" fill="#C9A227"/>
    </g>

    <!-- survey labels -->
    <g font-family="'Courier New', monospace" font-size="10.5" fill="#9FB8CE">
      <text x="978" y="176">BM-01</text>
      <text x="1055" y="245">TS-07</text>
    </g>

    <!-- north arrow / drafting compass, upper right -->
    <g transform="translate(1225,50)">
      <line x1="0" y1="24" x2="0" y2="-24" stroke="#C9A227" stroke-width="1.6"/>
      <path d="M 0 -24 L 6 -10 L 0 -14 L -6 -10 Z" fill="#C9A227"/>
      <circle cx="0" cy="24" r="3" fill="none" stroke="#CFE3F2" stroke-width="1.2"/>
      <text x="0" y="42" font-family="'Courier New', monospace" font-size="11"
            fill="#9FB8CE" text-anchor="middle">N</text>
    </g>

    <!-- accent rule -->
    <rect x="80" y="146" width="46" height="3" fill="#C9A227"/>

    <!-- name -->
    <text x="80" y="124" font-family="Arial, Helvetica, sans-serif"
          font-size="50" font-weight="700" fill="#F5F7FA" letter-spacing="0.5">Hemin Azizi</text>

    <!-- subtitle: verbatim from bio -->
    <text x="80" y="176" font-family="'Courier New', monospace" font-size="16.5" fill="#B7CDE0">
      Geospatial Research · Remote Sensing · Earth Observation · Scientific Computing
    </text>

    <!-- scale bar -->
    <g transform="translate(80,222)" stroke="#CFE3F2" stroke-opacity="0.8">
      <line x1="0" y1="0" x2="70" y2="0" stroke-width="1.6"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke-width="1.6"/>
      <line x1="35" y1="-3" x2="35" y2="3" stroke-width="1.2"/>
      <line x1="70" y1="-4" x2="70" y2="4" stroke-width="1.6"/>
    </g>
    <text x="160" y="226" font-family="'Courier New', monospace" font-size="11" fill="#8FA9C2">scale</text>
  </g>
</svg>
